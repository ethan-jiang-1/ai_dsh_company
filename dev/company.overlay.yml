# company 组合 overlay（实验/动议用）：挂在 shipped headless 上加公司行。
# 全源码域解析（workspace 协议），无 profile 安装混线。
# 语法：新增行用 insert；替换行用 - id:（教义见 guides/dev-loop §2 第 1 层）。
- insert:
    # 0.1.7 预设模型：registry（default）+ 每预设一行；本 overlay 只补 registry，
    # 五个预设行由 pack 的 bundle patch 数组并入（见 packages/company-pack/package.json）。
    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: ceo
    - id: tool-present
      name: '@deepseek-ai/dsh-tool-present'
    - id: agent-team
      name: '@deepseek-ai/dsh-experimental-agent-team'
    - id: tool-agent-team
      name: '@deepseek-ai/dsh-experimental-tool-agent-team'
    # 日期通道：行归 schedule-bundle 所有（0.2.0 harvest 批3）——**profile 级手动安装**
    # （release-smoke 预置 bundles 断言；dev web profile 手动加行见 guides/bootstrap.md）。
    # 本 overlay 不插：与已装 bundle 的行撞重复行 id 硬拒；「pack dependencies 声明 ⇒ reconcile
    # 自动启用」已实测证伪并撤销（harvest Note §输掉的方案）——勿再走 dependencies 路。
