# Authored keyless replay for company-pack CEO preset & handbook injection.
- id: llm-deepseek
  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true
- id: session-title-llm
  disabled: true
- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none
- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: never
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: !!js process.env.DSH_SNAPSHOT_PROVIDER
    model: !!js process.env.DSH_SNAPSHOT_MODEL
- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: company-replay
            name: Company replay
            models:
              - id: authored-handbook-ack
