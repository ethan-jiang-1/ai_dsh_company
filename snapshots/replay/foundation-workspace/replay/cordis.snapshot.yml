# Authored keyless replay; the shipped headless profile executes its real write tool.
- id: llm-deepseek
  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true
- id: session-title-llm
  disabled: true
- id: agent-instructions
  disabled: true
- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none
- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: workspace-write
    workspaceRoot: !!js process.cwd()
- id: fs-sandbox
  name: '@deepseek-ai/dsh-fs-sandbox'
  config:
    cwd: !!js process.cwd()
- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: never
- id: permission
  name: '@deepseek-ai/dsh-permission-presets'
  config:
    defaultPreset: fixture-workspace
    presets:
      fixture-workspace:
        sandbox: workspace-write
        approval: never
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: !!js process.env.DSH_SNAPSHOT_PROVIDER
    model: !!js process.env.DSH_SNAPSHOT_MODEL
- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: foundation-replay
            name: Foundation replay
            models:
              - id: authored-file-write
