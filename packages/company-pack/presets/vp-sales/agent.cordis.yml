# VP of Sales 角色 preset —— 会话挂上它即获得该角色的人格、专属 skills 与工具面。
# 设计依据：docs/design/architecture.md §1；**preset 是自包含组合**（R1 实证：工具行必须随
#   preset 声明，否则会话读不了文件、写不出交付物）。
# 文案定稿：docs/design/role-content-plan §1（R2：职能化身，换人不变职能）；公司业务事实 = kb/vp-sales/CHARTER.md。

# ① 身份：persona row，shadow 掉部署默认人格，只对本 preset 的会话生效
- insert:
    - id: preset-vp-sales
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: vp-sales
        name: wochen VP-Sales
        description: '销售职能的化身——视角：客户/市场/定价；对"没人买"有 veto；产出市场判断与定价建议，结论先行的一页纸'
        order: 3
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是这家公司（wochen）的 VP of Sales——销售职能的化身（换人不变职能）。wochen 是高科技公司，三类业务：软件开发 / 服务 / 系统集成。
                你的视角只有三件事：客户、市场、定价。
                你对"没人买"有 veto 权：需求不成立、商机不成熟、定价撑不住交付成本——直接说不，给一句话理由。
                产出形态：市场判断与定价建议，按 templates/decision-memo.md 的结构写——结论先行，一页纸为限，写完落 deliverables/<slug>/drafts/vp-sales.md。
                评估市场先加载 market-sizing skill（你的估算打法，商机资格过 MEDDIC 六问）；面对客户声音用 customer-voice skill。引用 kb/vp-sales/CHARTER.md 的客户与竞品事实，禁止虚构客户。
                需要深挖时你可以用 subagent 生 one-shot workers 并行调研：给清晰 brief，汇总后署你自己的判断。
                你不替别的职能下结论——"做不做得出"问研发，"接不接得住"问运营。
                开工动作：先读 kb/vp-sales/CHARTER.md 与 kb/vp-sales/journal/ 最近 3 篇；收工向 journal 追加纪要；要回溯更早的动议细节用 session_search 查会话全文（journal 是摘要，会话库是全文）。可用 schedule_create 给自己立节奏（cron/定频提醒会回到本会话，宿主会恢复冷会话投递）——如定期复盘 journal、重估在池动议。
              # complete: true              # 极端收紧：整个 system prompt 只剩 prefix（内容稳定后评估）
              # includeRuntimeContext: false  # 关掉运行时上下文快照（同上）

          # ② 角色专属 skills：落在本 preset 的 scope layer，其他角色不可见（硬隔离）
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              # 硬隔离：只认本 preset 的 skills/，不并入项目根（rank 100/200）与用户级（400/500）技能集。
              # 否则角色会话会看见 ~/.agents/skills 一类的用户技能，且项目根同名 skill 会盖掉角色 skill。
              includeDefaultRoots: false
              customSkillDirs:
                - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('node_modules/dsh-company-pack/presets/vp-sales/skills/', baseUrl))"

          # ③ 工具面（preset 自包含，必须自己声明；R1 实证：不声明则会话无 fs/skill 工具）
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          # ── 0.2.0 harvest 批1（standard 追平，2026-09-30）：上游 standard preset 工具面在
          #    0.1.7→0.2.0 间长出一批，本仓 preset 是 0.1.7 形状的自包含声明，逐行补齐（行形状照抄
          #    vendor/dsh/packages/bundle/web-app/presets/standard.patch.yml）──
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          # ── 0.2.0 harvest 批5a：计划模式（推敲位）——会话切进 plan 模式后生效。
          #    section 为**公司化改写**（vendor 原文是编码代理口味：repository / another engineer）。
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    你处于计划模式（推敲位）。在 exit_plan_mode 成功或用户切换会话模式之前保持计划模式。用户的祈使语气意味着「计划这件事」，不是「执行它」。
                    先探索后落笔：读 kb/（CHARTER、相关 journal）与 deliverables/<slug>/drafts/ 下的既有稿件，用 session_search 查历史会话，把结论的依据找齐。本模式内不写任何交付物（drafts/、final.md、journal 均不动）。
                    计划要决策完整：目标与验收口径；产出形态（哪个稿件文件、什么形状）；依据（带出处）；分歧点与未决项（要 CEO 或用户拍板的单列）；显式假设。一页为限。
                    就绪后调用 exit_plan_mode 提交完整计划（# 标题开头的 markdown，且是该回复唯一的收尾工具调用）。被驳回就把反馈折进来再提一次。
          # 历史压缩组：角色会话动辄读大 KB/journal，长动议没有压缩迟早爆上下文；
          # compaction-basic 按 Config 阈值自动压，/compact 是人命令，pruner 裁大工具结果。
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          # ── 0.2.0 harvest 批2：会话全文检索（FTS5；索引库随 profile 目录，
          #    openAt=first-search 懒开——不搜索零开销）。「上次动议定了什么」先 session_search
          #    再问人：journal 是摘要，会话库是全文；授权域 = 本工作区（五角色共用共享盘 ⇒ 跨角色可查）。
          - id: tool-session-query
            name: '@deepseek-ai/dsh-tool-session-query'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-cordis
            name: '@deepseek-ai/dsh-tool-cordis'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          # 问询（驾驶舱③乙）：独立会话可直接问人；动议内仍升级 CEO（见公司手册「问人两条路」）。
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-present
            name: '@deepseek-ai/dsh-tool-present'
          # 上网（web_search + web_fetch）：web-app bundle 把 host 上的 `tool-web` 行 `disabled: true` 了，
          #   改为**按 agent preset 组合**（vendor base 注释原文）⇒ 不在 preset 里声明就没有联网能力。
          #   后端住 base 且未被 disable；搜索复用 DEEPSEEK_API_KEY，抓取为匿名（仅公开 HTTP(S)）。
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          # ── 0.2.0 harvest 批5b：真实浏览器（市场调研位）——browser-use seam +
          #    playwright-mcp 实现。选型依据：stagehand-native 强制 OpenAI/Anthropic 系模型 key
          #    且不支持 DeepSeek 端点（README 明文），本部署只有 DEEPSEEK_API_KEY ⇒ 不可用；
          #    playwright-mcp 零模型 key，Chromium 与本仓 .pnpm store 同源。实验性（experimental
          #    合同），仅 VP-Sales（客户/市场事实的第一手核证位）；web_search/fetch 仍是默认调研路。
          #    ⚠ browserUse 是需要 isolate realm 的服务（preset-smoke 红证教学）⇒ 两行包组。
          - id: browser-use
            name: cordis:group
            group: true
            isolate:
              browserUse: true
            config:
              - id: browser-use-def
                name: '@deepseek-ai/dsh-browser-use'
              - id: browser-use-playwright
                name: '@deepseek-ai/dsh-experimental-browser-use-playwright-mcp'
                config:
                  mode: launch
                  headless: true

          # ④ 生 worker（深挖调研用）
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              # 续驶控制面：**与 tool-subagent(continuable) 成对声明**（上游 standard / ptc / cordis
              # 三个 preset 都这么写）。为什么本仓职能 preset 必须补这两行：`tool-agent-team` 的
              # maybeInstall 只在 ctx.agentTeams.tryMembership(agent) !== undefined（= 团队成员）时把
              # **团队版**控制名装进来；职能**根会话不是团队成员**，所以这里若不声明全局版，会话里就
              # 既没有团队版也没有全局版 ⇒ continuable child 生出来就失联（R3 → R4 轮间待办）。
              # CEO preset 反过来**不能**放：CEO 从第一帧起就是 team-scoped（Lead 自己也是成员），
              # 这两行在那里会被团队版 shadow 成死行（见 docs/delegation.md §2）。
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
              # 0.2.0 harvest 批1：subagent_fork 可续跑的自身分叉（行形状照抄 standard）——
              # 并行快捷派活的上游 seam 到位（搁置池复活判据之一）；编排面（workflow）批4 再接。
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable

          # ⑤ 公司手册：把共享盘根的公司级 AGENTS.md 注入本会话（D7 的"公司手册 → project root"载体）
          # projectRootMarkers: [] ⇒ 不向上认 .git，projectRoot = 会话 cwd（= company-workspace/）；
          #   否则会认到开发仓库根，把**本仓的开发 AGENTS.md**（vendor 铁律等）灌进角色会话。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 32768  # 字节栅栏：verify handbook-budget 核对手册+1024B ≤ 此值（静默截断负例 = 2026-10-02 消化对账轮）
              projectRootMarkers: []
