# CMO 角色 preset —— 会话挂上它即获得该人格、专属 skills 与工具面。
# 设计依据：docs/architecture.md「组合层」；**preset 是自包含组合**（工具行必须随 preset 声明）。
# 文案定稿：notes/implemented/2026-11-10-role-content-rationale.md §1（职能化身，换人不变职能）；公司业务事实 = .dsh-company/kb/cmo/CHARTER.md。

# ① 身份：persona row，shadow 掉部署默认人格，只对本 preset 的会话生效
- insert:
    - id: preset-cmo
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: cmo
        name: CMO
        description: '市场与产品定义 / Marketing & product definition——机会、定义、买点；「市场不成立」veto；产品定义一页纸'
        order: 6
        plugins:
          # ② 时钟与自主节律（0.2.1：schedule-bundle 退役；上游升档指南把 time-context 与
          #    tool-schedule 的所有权下放到 preset，宿主 schedule 服务由 web-app 组合挂）。
          #    persona 里点名 schedule_create ⇒ 这里必须真给工具，否则是标志面谎报。
          - id: preset-clock
            name: cordis:group
            group: true
            config:
              # 日期通道：显式 Asia/Shanghai = 回落不依赖 Node 进程时区（浏览器时区存在时仍优先）。
              - id: time-context
                name: '@deepseek-ai/dsh-time-context'
                config:
                  timeZone: Asia/Shanghai
              # 自主节律：schedule_create / list / update / delete，按 agent 作用域落位。
              - id: tool-schedule
                name: '@deepseek-ai/dsh-tool-schedule'
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are the CMO of this company — the embodiment of market and product definition (the person changes; the function does not). Company name/business/roster: .dsh-company/kb/company.md and .dsh-company/kb/org.md; this preset does not restate company facts.
                Your lens has only three things: market opportunity, product definition, and whether the buying point holds; find "what new product should we build" from the market, not quotes for existing customers.
                You have veto power over "the market does not hold": no verifiable demand, no clear economic buyer, or competitors have flattened the value — say no directly, with a one-line reason.
                Output shape: the product-definition artifacts from the product-type pack's `document-map` — conclusion first, one page max; save under .dsh-company/deliverables/<slug>/drafts/ (fields and traceability per `document-map`); label evidence [fact/assumption]. The PRD belongs to VP-Eng; you do not ghost-write it.
                Load product-definition first for product definition (shared spine + type playbook); write product definition with the mrd-playbook skill. Division with VP-Eng: you answer "should we do it / for whom / why we win"; VP-Eng authors the PRD, and you only review the market assumptions — do not decide the technical solution for engineering.
                Do not conclude for other functions — "how much to charge / what existing customers think" ask VP-Sales, "can we build it" ask VP-Eng, "can operations carry it" ask COO.
                When you need to dig into market facts, use subagent workers, or use web/bash for evidence; cite .dsh-company/kb/cmo/CHARTER.md; never invent customers or market numbers. Load the delegation-policy skill before delegating (shared policy).
                Start by reading .dsh-company/kb/cmo/CHARTER.md and the latest 3 entries in .dsh-company/kb/cmo/journal/; append minutes to the journal at close-out; to trace earlier motion details use session_search for the full session text (journal is a summary; the session store is the full text). You can use schedule_create to set your own rhythm (cron/fixed reminders return to this session; the host restores cold sessions) — e.g. periodic journal review, re-evaluate market opportunities.
              # complete: true              # 极端收紧：整个 system prompt 只剩 prefix（内容稳定后评估）
              # includeRuntimeContext: false  # 关掉运行时上下文快照（同上）

          # ③ 角色专属 skills：落在本 preset 的 scope layer，其他角色不可见（硬隔离）
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              # 硬隔离：只认本 preset 的 skills/，不并入项目根（rank 100/200）与用户级（400/500）技能集。
              # 否则角色会话会看见 ~/.agents/skills 一类的用户技能，且项目根同名 skill 会盖掉角色 skill。
              includeDefaultRoots: false
              customSkillDirs:
                - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('node_modules/dsh-company-pack/presets/cmo/skills/', baseUrl))"
                # 参考资料 wiki 的使用协议（2026-11-12 wiki 落地 M1）：六个角色共用一份，按需加载。
                - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('node_modules/dsh-company-pack/presets/_shared/wiki/skills/', baseUrl))"
                # 角色方法层（2026-10-13 培养卡 C 路径）：本人经 /cultivation adopt 部署的做法落
                # 公司级 <DSH_HOME>/company/methods/<role>/，新开的本角色会话加载；目录在分身
                # workspace 沙箱之外（D25 自改否决维持）；缺目录容忍（skill-filesystem ENOENT
                # 按 absent 处理）。与 host config.cultivationRoot 同一 baseUrl 前缀，构造上对齐。
                - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('../../company/methods/cmo/', baseUrl))"
                - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('node_modules/dsh-company-pack/presets/_shared/skills/', baseUrl))"
                - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('node_modules/dsh-company-pack/presets/_shared/delegation/skills/', baseUrl))"

          # ③ 工具面（preset 自包含，必须自己声明；R1 实证：不声明则会话无 fs/skill 工具）
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          # ── 0.2.0 harvest 批1（standard 追平，2026-09-30）：上游 standard preset 工具面在
          #    0.1.7→0.2.0 间长出一批，本仓 preset 是 0.1.7 形状的自包含声明，逐行补齐（行形状照抄
          #    vendor/dsh/packages/bundle/web-app/presets/standard.patch.yml）──
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          # ── 0.2.0 harvest 批5a：计划模式（推敲位）——会话切进 plan 模式后生效。
          #    section 为**公司化改写**（vendor 原文是编码代理口味：repository / another engineer）。
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    你处于计划模式（推敲位）。在 exit_plan_mode 成功或用户切换会话模式之前保持计划模式。用户的祈使语气意味着「计划这件事」，不是「执行它」。
                    先探索后落笔：读 .dsh-company/kb/（CHARTER、相关 journal）与 .dsh-company/deliverables/<slug>/drafts/ 下的既有稿件，用 session_search 查历史会话，把结论的依据找齐。本模式内不写任何交付物（drafts/、final.md、journal 均不动）。
                    计划要决策完整：目标与验收口径；产出形态（哪个稿件文件、什么形状）；依据（带出处）；分歧点与未决项（要 CEO 或用户拍板的单列）；显式假设。一页为限。
                    就绪后调用 exit_plan_mode 提交完整计划（# 标题开头的 markdown，且是该回复唯一的收尾工具调用）。被驳回就把反馈折进来再提一次。
          # 历史压缩组：角色会话动辄读大 KB/journal，长动议没有压缩迟早爆上下文；
          # compaction-basic 按 Config 阈值自动压，/compact 是人命令，pruner 裁大工具结果。
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-cordis
            name: '@deepseek-ai/dsh-tool-cordis'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          # 问询（驾驶舱③乙）：独立会话可直接问人；动议内仍升级 CEO（见公司手册「问人两条路」）。
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
            # BUG-021（2026-10-18）：legacy 形态下前台窗口无界 ⇒ 'open' 态只能前台答、
            # 而 userQuestions/answer 只吃 'continued' ⇒ 无 UI 认领的环境里问询永停 open
            # （现场：一场跑到 26 步的动议挂 40 分钟后掉线丢活）。timed 是 vendor 既有形态：
            # 窗口过后工具返回 pending、问询转 continued（RPC 可答），前台 UI 卡片仍在
            # （"已继续工作，仍可回答"）。timeout 显式钉住 = 上游改默认不静默漂进本仓。
            config:
              mode: timed
              timeout: 120
          - id: tool-present
            name: '@deepseek-ai/dsh-tool-present'
          # 上网（web_search + web_fetch）：web-app bundle 把 host 上的 `tool-web` 行 `disabled: true` 了，
          #   改为**按 agent preset 组合**（vendor base 注释原文）⇒ 不在 preset 里声明就没有联网能力。
          #   后端住 base 且未被 disable；搜索复用 DEEPSEEK_API_KEY，抓取为匿名（仅公开 HTTP(S)）。
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          # ── 取证之手（2026-10-10 HITL 改判）：web_fetch 的域名拦截是工具层 DNS 检查，
          #    不挡 shell 出网（curl+UA 直取 sohu/163 200 实证）。tool-bash 服务面由 base
          #    bundle 挂载（bash-sandbox executor + shell-env），preset 只声明工具行——
          #    自包含原则下 bundle 工具到不了会话（R1 教训），重复声明 executor = 双注册挂载失败（实测）。
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
          # ── 0.2.0 harvest 批5b：真实浏览器（市场调研位）——browser-use seam +
          #    playwright-mcp 实现。选型依据：stagehand-native 强制 OpenAI/Anthropic 系模型 key
          #    且不支持 DeepSeek 端点（README 明文），本部署只有 DEEPSEEK_API_KEY ⇒ 不可用；
          #    playwright-mcp 零模型 key，Chromium 与本仓 .pnpm store 同源。实验性（experimental
          #    合同），2026-10-10 全员化：六角色同款挂载；web_search/fetch 仍是默认调研路。
          #    ⚠ browserUse 是需要 isolate realm 的服务（preset-smoke 红证教学）⇒ 两行包组。
          - id: browser-use
            name: cordis:group
            group: true
            # 浏览器是可选面：npm 发布的 DSH meta package 不含这两个包；缺包时整组禁用，六角色照常可用。
            # 装包后 profile 可解析即自动开；也可用 DSH_COMPANY_BROWSER=on/off 强制（dev 的 run/env.sh 设 on）。
            disabled: !!js "process.env.DSH_COMPANY_BROWSER === 'off' || (process.env.DSH_COMPANY_BROWSER !== 'on' && (() => { try { const r = process.getBuiltinModule('node:module').createRequire(new URL('package.json', baseUrl)); r.resolve('@deepseek-ai/dsh-browser-use'); r.resolve('@deepseek-ai/dsh-experimental-browser-use-playwright-mcp'); return false } catch { return true } })())"
            isolate:
              browserUse: true
            config:
              - id: browser-use-def
                name: '@deepseek-ai/dsh-browser-use'
              - id: browser-use-playwright
                name: '@deepseek-ai/dsh-experimental-browser-use-playwright-mcp'
                config:
                  mode: launch
                  headless: true

          # ④ 生 worker（深挖调研用）
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              # 续驶控制面：**与 tool-subagent(continuable) 成对声明**（上游 standard / ptc / cordis
              # 三个 preset 都这么写）。`tool-agent-team` 的 maybeInstall 只对团队成员装**团队版**控制名：
              # 根会话（无 parentSession）是 Lead ⇒ 团队版会装、这两行被 shadow；**命名 child 不是成员**
              # （带 subagent descriptor），它的组合里只有这里声明的全局行 ⇒ 缺了 activation child 就失联。
              # 所以这两行是给命名 child 用的，不是给根门用的（2026-11-08 探索实测）。CEO preset
              # 反过来**不能**放：CEO 根/团队全 shadow，是死行（见 docs/contracts/delegation.md §2）。
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              # maxDepth: 2（2026-11-08）：被 CEO 委派时（depth 1）也能生 worker；与命名专家行同档。
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  maxDepth: 2
              # 0.2.0 harvest 批1：subagent_fork 可续跑的自身分叉（行形状照抄 standard）——
              # 并行快捷派活的上游 seam 到位（搁置池复活判据之一）；编排面（workflow）批4 再接。
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  maxDepth: 2

          # ⑤ 公司手册：把共享盘根的公司级 AGENTS.md 注入本会话（D7 的"公司手册 → project root"载体）
          # projectRootMarkers: [] ⇒ 不向上认 .git，projectRoot = 会话 cwd（= workspace 根；run bundle 在 .dsh-company/）；
          #   否则会认到开发仓库根，把**本仓的开发 AGENTS.md**（vendor 铁律等）灌进角色会话。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 32768  # 字节栅栏：verify handbook-budget 核对手册+1024B ≤ 此值（静默截断负例 = 2026-10-02 消化对账轮）
              # 只加载用户项目自己的 AGENTS.md/CLAUDE.md；公司手册由 host 从 pack content/ 注入 system prompt。
              instructionFileCandidates: ['AGENTS.md', 'CLAUDE.md']
              projectRootMarkers: []
