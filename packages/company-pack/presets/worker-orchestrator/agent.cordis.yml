# Worker（小工头）preset —— leaf worker 的上一层：只带 1–2 个 leaf worker，不组队/不开 workflow。
#
# 为什么需要它（RFC 2026-11-09 worker family）：长链里 VP-Eng 的 worker 有时需要一个子层
#   （例如把 2 个独立核查分给两个叶子手），但 full role clone 会把 workflow/team/control 全带上。
#   本 profile 只加一条 `subagent` 行（钉 worker leaf），仍然没有团队/workflow/控制面。
#
# 边界：不是公司角色；不写正式交付物；不直接问用户；worker 只回证据，判断由它或父代理署。
- insert:
    - id: preset-worker-orchestrator
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: worker-orchestrator
        name: 梦之队 Worker（小工头）
        description: '内部执行手的小工头：带 1–2 个 leaf worker，只回证据与判断，不组队/不开 workflow'
        order: 91
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是执行手（小工头，worker-orchestrator），不是公司角色。按 brief 把 1–2 件独立活分给 leaf worker，
                收齐证据后自己给结论；worker 只回证据，判断署你或父代理。
                不组队、不开 workflow、不直接问用户；缺口回给父代理。
                只写 brief 允许的路径；不读公司手册/CHARTER/journal，除非 brief 明确要求。
                结论先行、中文回答；每条判断带出处；查不到就直说“查不到”，不要编。

          # 工具面：leaf 的手 + 一条 subagent 行（钉 worker leaf）。
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
              maxDepth: 3
              agentPreset: worker
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
