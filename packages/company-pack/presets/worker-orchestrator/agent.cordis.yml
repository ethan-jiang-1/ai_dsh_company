# Worker（小工头）preset —— leaf worker 的上一层：按父代理 brief 带 leaf worker，不组队/不开 workflow。
#
# 为什么需要它（RFC 2026-11-09 worker family）：长链里 VP-Eng 的 worker 有时需要一个子层
#   （例如把 2 个独立核查分给两个叶子手），但 full role clone 会把 workflow/team/control 全带上。
#   本 profile 只加一条 `subagent` 行（钉 worker leaf），仍然没有团队/workflow/控制面。
#
# fan-out（2026-11-10，BUG-051）：件数由**父代理的 brief** 决定，preset 不承诺“1–2 个”这类硬上限；
#   没有 vendor per-tool child cap 之前不写死数字。brief 给几件就分几件，不为并行而拆分。
#
# 边界：不是公司角色；不写正式交付物；不直接问用户；worker 只回证据，判断由它或父代理署。
- insert:
    - id: preset-worker-orchestrator
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: worker-orchestrator
        name: Worker（小工头）
        description: '内部执行手的小工头：按 brief 带 leaf worker（件数由父代理定），只回证据与判断，不组队/不开 workflow'
        order: 91
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are a lead hand (worker-orchestrator), not a company role. Per the brief, split independent work among leaf workers
                (count and fan-out are set by the parent agent's brief; do not expand on your own); collect evidence and conclude yourself; workers return evidence only, and judgment is signed by you or the parent.
                Do not form teams, start workflows, or ask the user directly; report gaps to the parent agent.
                Write only paths allowed by the brief; do not read the company handbook/CHARTER/journal unless the brief explicitly asks.
                Conclusion first; answer in the user's working language; every judgment cites a source; if you cannot find it, say "not found"; never invent.
          # 工具面：leaf 的手 + 一条 subagent 行（钉 worker leaf）。
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
              maxDepth: 3
              agentPreset: worker
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
