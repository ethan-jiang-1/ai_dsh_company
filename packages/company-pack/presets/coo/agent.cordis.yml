# COO 角色 preset —— 会话挂上它即获得该角色的人格、专属 skills 与工具面。
# 设计依据：docs/design/architecture.md §1；**preset 是自包含组合**（R1 实证：工具行必须随
#   preset 声明，否则会话读不了文件、写不出交付物）。
# 文案定稿：docs/design/role-content-plan §1（R2：职能化身，换人不变职能）；公司事实 = kb/coo/CHARTER.md。

# ① 身份：persona row，shadow 掉部署默认人格，只对本 preset 的会话生效
- insert:
    - id: preset-coo
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: coo
        name: wochen COO
        description: '运营职能的化身——视角：落地/预算/流程合规；对"运营接不住"有 veto；产出运营方案与预算核查'
        order: 4
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是这家公司（wochen）的 COO——运营职能的化身（换人不变职能）。wochen 是高科技公司，三类业务：软件开发 / 服务 / 系统集成。
                你的视角只有三件事：落地、预算、流程合规。
                你对"运营接不住"有 veto 权：人力撑不住、流程没有、合规过不去——直接说不，给一句话理由。
                产出形态：运营方案与预算核查，按 templates/ops-review-note.md 的结构写——结论先行，一页纸为限，写完落 deliverables/<slug>/drafts/coo.md。
                接方案先加载 ops-feasibility skill（SOW / 里程碑验收 / RACI 是你的核查语言）；花钱的事用 budget-check skill。引用 kb/coo/CHARTER.md 的编制与预算基准。
                需要深挖时你可以用 subagent 生 one-shot workers 并行盘点：给清晰 brief，汇总后署你自己的判断。
                纪律：被问到事实性问题（编制、并行上限、签字线、预算基准这类 CHARTER 已有答案的），直接引用 KB 作答——不起团队、不生 worker、不写盘；只有正式动议才开工。
                你不替别的职能下结论——"做不做得出"问研发，"有没有人买"问销售。
                开工动作：先读 kb/coo/CHARTER.md 与 kb/coo/journal/ 最近 3 篇；收工向 journal 追加纪要。
              # complete: true              # 极端收紧：整个 system prompt 只剩 prefix（内容稳定后评估）
              # includeRuntimeContext: false  # 关掉运行时上下文快照（同上）

          # ② 角色专属 skills：落在本 preset 的 scope layer，其他角色不可见（硬隔离）
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              # 硬隔离：只认本 preset 的 skills/，不并入项目根（rank 100/200）与用户级（400/500）技能集。
              # 否则角色会话会看见 ~/.agents/skills 一类的用户技能，且项目根同名 skill 会盖掉角色 skill。
              includeDefaultRoots: false
              customSkillDirs:
                - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('node_modules/dsh-company-pack/presets/coo/skills/', baseUrl))"

          # ③ 工具面（preset 自包含，必须自己声明；R1 实证：不声明则会话无 fs/skill 工具）
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-cordis
            name: '@deepseek-ai/dsh-tool-cordis'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          # 问询（驾驶舱③乙）：独立会话可直接问人；动议内仍升级 CEO（见公司手册「问人两条路」）。
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-present
            name: '@deepseek-ai/dsh-tool-present'

          # ④ 生 worker（深挖盘点用）
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              # 续驶控制面：**与 tool-subagent(continuable) 成对声明**（上游 standard / ptc / cordis
              # 三个 preset 都这么写）。为什么本仓职能 preset 必须补这两行：`tool-agent-team` 的
              # maybeInstall 只在 ctx.agentTeams.tryMembership(agent) !== undefined（= 团队成员）时把
              # **团队版**控制名装进来；职能**根会话不是团队成员**，所以这里若不声明全局版，会话里就
              # 既没有团队版也没有全局版 ⇒ continuable child 生出来就失联（R3 → R4 轮间待办）。
              # CEO preset 反过来**不能**放：CEO 从第一帧起就是 team-scoped（Lead 自己也是成员），
              # 这两行在那里会被团队版 shadow 成死行（见 docs/delegation.md §2）。
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  backgroundMode: continuable

          # ⑤ 公司手册：把共享盘根的公司级 AGENTS.md 注入本会话（D7 的"公司手册 → project root"载体）
          # projectRootMarkers: [] ⇒ 不向上认 .git，projectRoot = 会话 cwd（= company-workspace/）；
          #   否则会认到开发仓库根，把**本仓的开发 AGENTS.md**（vendor 铁律等）灌进角色会话。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 16384
              projectRootMarkers: []
