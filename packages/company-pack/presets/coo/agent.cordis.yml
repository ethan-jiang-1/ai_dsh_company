# COO 角色 preset —— 会话挂上它即获得该角色的人格、专属 skills 与工具面。
# 设计依据：docs/design/architecture.md §1；**preset 是自包含组合**（R1 实证：工具行必须随
#   preset 声明，否则会话读不了文件、写不出交付物）。
# 文案定稿：docs/design/role-content-plan §1（R2：职能化身，换人不变职能）；公司事实 = kb/coo/CHARTER.md。

# ① 身份：persona row，shadow 掉部署默认人格，只对本 preset 的会话生效
- insert:
    - id: preset-coo
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: coo
        name: 梦之队 COO
        description: '运营职能的化身——视角：落地/预算/流程合规；对"运营接不住"有 veto；产出运营方案与预算核查'
        order: 4
        plugins:
          # ② 时钟与自主节律（0.2.1：schedule-bundle 退役；上游升档指南把 time-context 与
          #    tool-schedule 的所有权下放到 preset，宿主 schedule 服务由 web-app 组合挂）。
          #    persona 里点名 schedule_create ⇒ 这里必须真给工具，否则是标志面谎报。
          - id: preset-clock
            name: cordis:group
            group: true
            config:
              # 日期通道：显式 Asia/Shanghai = 回落不依赖 Node 进程时区（浏览器时区存在时仍优先）。
              - id: time-context
                name: '@deepseek-ai/dsh-time-context'
                config:
                  timeZone: Asia/Shanghai
              # 自主节律：schedule_create / list / update / delete，按 agent 作用域落位。
              - id: tool-schedule
                name: '@deepseek-ai/dsh-tool-schedule'
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是这家公司的 COO——运营职能的化身（换人不变职能）。公司名/业务/编制见 kb/company.md 与 kb/org.md；本 preset 不复述公司事实。
                你的视角只有三件事：落地、预算、流程合规。
                你对"运营接不住"有 veto 权：人力撑不住、流程没有、合规过不去——直接说不，给一句话理由。
                产出形态：运营方案与预算核查，按 templates/ops-review-note.md 的结构写——结论先行，一页纸为限，写完落 deliverables/<slug>/drafts/coo.md。
                接方案先加载 ops-feasibility skill（SOW / 里程碑验收 / RACI 是你的核查语言）；花钱的事用 budget-check skill。引用 kb/coo/CHARTER.md 的编制与预算基准。
                需要深挖时你可以用 subagent 生 workers 并行盘点：给清晰 brief，汇总后署你自己的判断。
                纪律：被问到事实性问题（编制、并行上限、签字线、预算基准这类 CHARTER 已有答案的），直接引用 KB 作答——不起团队、不生 worker、不写盘；只有正式动议才开工。
                你不替别的职能下结论——"做不做得出"问研发，"有没有人买"问销售。
                开工动作：先读 kb/coo/CHARTER.md 与 kb/coo/journal/ 最近 3 篇；收工向 journal 追加纪要；要回溯更早的动议细节用 session_search 查会话全文（journal 是摘要，会话库是全文）。可用 schedule_create 给自己立节奏（cron/定频提醒会回到本会话，宿主会恢复冷会话投递）——如定期复盘 journal、重估在池动议。
              # complete: true              # 极端收紧：整个 system prompt 只剩 prefix（内容稳定后评估）
              # includeRuntimeContext: false  # 关掉运行时上下文快照（同上）

          # ③ 角色专属 skills：落在本 preset 的 scope layer，其他角色不可见（硬隔离）
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              # 硬隔离：只认本 preset 的 skills/，不并入项目根（rank 100/200）与用户级（400/500）技能集。
              # 否则角色会话会看见 ~/.agents/skills 一类的用户技能，且项目根同名 skill 会盖掉角色 skill。
              includeDefaultRoots: false
              customSkillDirs:
                - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('node_modules/dsh-company-pack/presets/coo/skills/', baseUrl))"
                # 角色方法层（2026-10-13 培养卡 C 路径）：本人经 /cultivation adopt 部署的做法落
                # profile 根下 company-cultivation/<role>/，新开的本角色会话加载；目录在分身
                # workspace 沙箱之外（D25 自改否决维持）；缺目录容忍（skill-filesystem ENOENT
                # 按 absent 处理）。与 host config.cultivationRoot 同一 baseUrl 前缀，构造上对齐。
                - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('company-cultivation/coo/', baseUrl))"

          # ③ 工具面（preset 自包含，必须自己声明；R1 实证：不声明则会话无 fs/skill 工具）
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          # ── 0.2.0 harvest 批1（standard 追平，2026-09-30）：上游 standard preset 工具面在
          #    0.1.7→0.2.0 间长出一批，本仓 preset 是 0.1.7 形状的自包含声明，逐行补齐（行形状照抄
          #    vendor/dsh/packages/bundle/web-app/presets/standard.patch.yml）──
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          # ── 0.2.0 harvest 批5a：计划模式（推敲位）——会话切进 plan 模式后生效。
          #    section 为**公司化改写**（vendor 原文是编码代理口味：repository / another engineer）。
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    你处于计划模式（推敲位）。在 exit_plan_mode 成功或用户切换会话模式之前保持计划模式。用户的祈使语气意味着「计划这件事」，不是「执行它」。
                    先探索后落笔：读 kb/（CHARTER、相关 journal）与 deliverables/<slug>/drafts/ 下的既有稿件，用 session_search 查历史会话，把结论的依据找齐。本模式内不写任何交付物（drafts/、final.md、journal 均不动）。
                    计划要决策完整：目标与验收口径；产出形态（哪个稿件文件、什么形状）；依据（带出处）；分歧点与未决项（要 CEO 或用户拍板的单列）；显式假设。一页为限。
                    就绪后调用 exit_plan_mode 提交完整计划（# 标题开头的 markdown，且是该回复唯一的收尾工具调用）。被驳回就把反馈折进来再提一次。
          # 历史压缩组：角色会话动辄读大 KB/journal，长动议没有压缩迟早爆上下文；
          # compaction-basic 按 Config 阈值自动压，/compact 是人命令，pruner 裁大工具结果。
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          # ── 0.2.0 harvest 批2：会话全文检索（FTS5；索引库随 profile 目录，
          #    openAt=first-search 懒开——不搜索零开销）。「上次动议定了什么」先 session_search
          #    再问人：journal 是摘要，会话库是全文；授权域 = 本工作区（五角色共用共享盘 ⇒ 跨角色可查）。
          - id: tool-session-query
            name: '@deepseek-ai/dsh-tool-session-query'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-cordis
            name: '@deepseek-ai/dsh-tool-cordis'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          # 问询（驾驶舱③乙）：独立会话可直接问人；动议内仍升级 CEO（见公司手册「问人两条路」）。
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
            # BUG-021（2026-10-18）：legacy 形态下前台窗口无界 ⇒ 'open' 态只能前台答、
            # 而 userQuestions/answer 只吃 'continued' ⇒ 无 UI 认领的环境里问询永停 open
            # （现场：一场跑到 26 步的动议挂 40 分钟后掉线丢活）。timed 是 vendor 既有形态：
            # 窗口过后工具返回 pending、问询转 continued（RPC 可答），前台 UI 卡片仍在
            # （"已继续工作，仍可回答"）。timeout 显式钉住 = 上游改默认不静默漂进本仓。
            config:
              mode: timed
              timeout: 120
          - id: tool-present
            name: '@deepseek-ai/dsh-tool-present'
          # 上网（web_search + web_fetch）：web-app bundle 把 host 上的 `tool-web` 行 `disabled: true` 了，
          #   改为**按 agent preset 组合**（vendor base 注释原文）⇒ 不在 preset 里声明就没有联网能力。
          #   后端住 base 且未被 disable；搜索复用 DEEPSEEK_API_KEY，抓取为匿名（仅公开 HTTP(S)）。
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          # ── 取证之手（2026-10-10）：web_fetch 的域名拦截是工具层 DNS 检查，不挡 shell
          #    出网（curl+UA 直取 200 实证）。bash 由 base 的 bash-sandbox executor 驱动，
          #    preset 只声明工具行（自包含原则：bundle 工具到不了会话——R1 教训）。
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
          # ── 真实浏览器（第一手核证位，2026-10-10 全员化）：JS 重页面 / 反爬站 / 公众号文章
          #    的兜底通道；playwright-mcp 零模型 key，Chromium 与本仓 .pnpm store 同源。
          #    ⚠ browserUse 是需要 isolate realm 的服务 ⇒ 两行包组（shape 照 vp-sales 首挂）。
          - id: browser-use
            name: cordis:group
            group: true
            isolate:
              browserUse: true
            config:
              - id: browser-use-def
                name: '@deepseek-ai/dsh-browser-use'
              - id: browser-use-playwright
                name: '@deepseek-ai/dsh-experimental-browser-use-playwright-mcp'
                config:
                  mode: launch
                  headless: true

          # ④ 生 worker（深挖盘点用）
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              # 续驶控制面：**与 tool-subagent(continuable) 成对声明**（上游 standard / ptc / cordis
              # 三个 preset 都这么写）。为什么本仓职能 preset 必须补这两行：`tool-agent-team` 的
              # maybeInstall 只在 ctx.agentTeams.tryMembership(agent) !== undefined（= 团队成员）时把
              # **团队版**控制名装进来；职能**根会话不是团队成员**，所以这里若不声明全局版，会话里就
              # 既没有团队版也没有全局版 ⇒ continuable child 生出来就失联（R3 → R4 轮间待办）。
              # CEO preset 反过来**不能**放：CEO 从第一帧起就是 team-scoped（Lead 自己也是成员），
              # 这两行在那里会被团队版 shadow 成死行（见 docs/delegation.md §2）。
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
              # 0.2.0 harvest 批1：subagent_fork 可续跑的自身分叉（行形状照抄 standard）——
              # 并行快捷派活的上游 seam 到位（搁置池复活判据之一）；编排面（workflow）批4 再接。
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork

          # ⑤ 公司手册：把共享盘根的公司级 AGENTS.md 注入本会话（D7 的"公司手册 → project root"载体）
          # projectRootMarkers: [] ⇒ 不向上认 .git，projectRoot = 会话 cwd（= company-workspace/）；
          #   否则会认到开发仓库根，把**本仓的开发 AGENTS.md**（vendor 铁律等）灌进角色会话。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 32768  # 字节栅栏：verify handbook-budget 核对手册+1024B ≤ 此值（静默截断负例 = 2026-10-02 消化对账轮）
              projectRootMarkers: []
