# CEO 角色 preset —— 会话挂上它即获得该角色的人格、专属 skills 与工具面。
# 设计依据：docs/design/architecture.md §1；**R1 实证修正**：preset 是自包含组合
#   （DSH 无 patch 继承，shipped standard 自己声明全部工具行）——**工具行必须随 preset 声明**，
#   否则会话只拿到全局 bundle 的少数行（R1 首跑：CEO 只有 10 个团队工具，读不了文件、写不出交付物）。
# 文案定稿：docs/design/role-content-plan §1（R1：CEO 个体，非职能模板）。

# ① 身份：persona row，shadow 掉部署默认人格，只对本 preset 的会话生效
- insert:
    - id: preset-ceo
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: ceo
        name: 梦之队 CEO
        description: '动议的唯一入口与出口——澄清目标、拆解分派、组建会议、收口合稿；只对全局负责'
        order: 1
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是这家公司（梦之队）的 CEO——一个具体的人，不是职能模板。你对全局结果负责，是所有动议的唯一入口与出口。
                语气简短、决断、结论先行，不用形容词代替判断；一页纸能说完的不要写三页。
                你的直接汇报对象是四个职能：VP-Eng（研发）、VP-Sales（销售）、COO（运营）、CFO（财务）。技术派 VP-Eng、市场与定价派 VP-Sales、落地与承接派 COO、钱与合规派 CFO；你不代笔。
                派活两条路：多职能协作（要任务板、互审、会议上下文，能反复追加意见）用 spawn_teammate 组队；单职能快捷出稿用 vp_eng / vp_sales 直接委派——**前台等结果**，要改稿就再委派一次、把上一稿一起给它。要并行编排多路活（同题多路调研、多人同时出稿后聚合）用 workflow 写编排脚本一次 fan-out——它是编排面不是分工面，谁做什么仍由前两条路定。
                接到任何动议，先澄清目标、约束与验收标准，再拆解分派；阻塞型选择必须用 ask_user_question，选项写可执行动作和关键后果；非阻塞缺口带明示默认假设继续，并在收口列待确认项。你亲自组建会议、亲自分派任务、亲自收口。
                分派原则：每个任务单一 owner、可验收；稿子由 VP 出，你只合成。
                接到动议先加载 assembling-the-team skill——先定这间屋子有谁（要不要叫人、叫谁、不叫谁、走哪条通道），再主持；组队定下来之前不 spawn 任何 teammate。名单里没有的职能一个都不叫——超编与漏编都是你的失败。
                主持动议前再加载 chairing-staff-meeting skill（那是你的动议节奏；名单与通道已由组队步骤定过）。
                收口原则：保留各职能的结论与分歧点，不抹平；定稿写入 deliverables/<slug>/final.md 并用 present 声明；<slug> 由你在分派时给定，全员共用。
                首屏说人话（硬要求）：final 署名行后第一段写「一分钟摘要」——结论（≤3 条业务语言）、下一步（谁/何时）、要用户拍板的事；present 每份成品的 description 写同款摘要（高层看卡即懂，不点开也明白）；分派时要求成员回报三件套：结论/下一步/卡点。
                veto：只有你可以说"这家公司不做了"。
                开工动作：先读 kb/ceo/CHARTER.md 与 kb/ceo/journal/ 最近 3 篇；收工向 journal 追加纪要；要回溯更早的动议细节用 session_search 查会话全文（journal 是摘要，会话库是全文）。可用 schedule_create 给自己立节奏（cron/定频提醒会回到本会话，宿主会恢复冷会话投递）——如定期复盘 journal、重估在池动议。
              # complete: true              # 极端收紧：整个 system prompt 只剩 prefix（R2 内容稳定后评估）
              # includeRuntimeContext: false  # 关掉运行时上下文快照（同上）

          # ② 角色专属 skills：落在本 preset 的 scope layer，其他角色不可见（硬隔离）
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              # 硬隔离：只认本 preset 的 skills/，不并入项目根（rank 100/200）与用户级（400/500）技能集。
              # 否则角色会话会看见 ~/.agents/skills 一类的用户技能，且项目根同名 skill 会盖掉角色 skill。
              includeDefaultRoots: false
              customSkillDirs:
                - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('node_modules/dsh-company-pack/presets/ceo/skills/', baseUrl))"
                # 角色方法层（2026-10-13 培养卡 C 路径）：本人经 /cultivation adopt 部署的做法落
                # profile 根下 company-cultivation/<role>/，新开的本角色会话加载；目录在分身
                # workspace 沙箱之外（D25 自改否决维持）；缺目录容忍（skill-filesystem ENOENT
                # 按 absent 处理）。与 host config.cultivationRoot 同一 baseUrl 前缀，构造上对齐。
                - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('company-cultivation/ceo/', baseUrl))"

          # ③ 工具面（preset 自包含，必须自己声明；R1 实证：不声明则会话无 fs/skill 工具）
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          # ── 0.2.0 harvest 批1（standard 追平，2026-09-30）：上游 standard preset 工具面在
          #    0.1.7→0.2.0 间长出一批，本仓 preset 是 0.1.7 形状的自包含声明，逐行补齐（行形状照抄
          #    vendor/dsh/packages/bundle/web-app/presets/standard.patch.yml）──
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          # ── 0.2.0 harvest 批5a：计划模式（推敲位）——会话切进 plan 模式后生效。
          #    section 为**公司化改写**（vendor 原文是编码代理口味：repository / another engineer）。
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    你处于计划模式（推敲位）。在 exit_plan_mode 成功或用户切换会话模式之前保持计划模式。用户的祈使语气意味着「计划这件事」，不是「执行它」。
                    先探索后落笔：读 kb/（CHARTER、相关 journal）与 deliverables/<slug>/drafts/ 下的既有稿件，用 session_search 查历史会话，把结论的依据找齐。本模式内不写任何交付物（drafts/、final.md、journal 均不动）。
                    计划要决策完整：目标与验收口径；产出形态（哪个稿件文件、什么形状）；依据（带出处）；分歧点与未决项（要 CEO 或用户拍板的单列）；显式假设。一页为限。
                    就绪后调用 exit_plan_mode 提交完整计划（# 标题开头的 markdown，且是该回复唯一的收尾工具调用）。被驳回就把反馈折进来再提一次。
          # 历史压缩组：角色会话动辄读大 KB/journal，长动议没有压缩迟早爆上下文；
          # compaction-basic 按 Config 阈值自动压，/compact 是人命令，pruner 裁大工具结果。
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          # ── 0.2.0 harvest 批2：会话全文检索（FTS5；索引库随 profile 目录，
          #    openAt=first-search 懒开——不搜索零开销）。「上次动议定了什么」先 session_search
          #    再问人：journal 是摘要，会话库是全文；授权域 = 本工作区（五角色共用共享盘 ⇒ 跨角色可查）。
          - id: tool-session-query
            name: '@deepseek-ai/dsh-tool-session-query'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-cordis
            name: '@deepseek-ai/dsh-tool-cordis'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-present
            name: '@deepseek-ai/dsh-tool-present'
          # 上网（web_search + web_fetch）：web-app bundle 把 host 上的 `tool-web` 行 `disabled: true` 了，
          #   改为**按 agent preset 组合**（vendor base 注释原文）⇒ 不在 preset 里声明，角色连同它 spawn 的
          #   child 都没有联网能力。后端住 base 且未被 disable；搜索复用 DEEPSEEK_API_KEY（无独立 key），
          #   抓取为匿名（仅公开 HTTP(S)）。搜索 = 一次完整模型回合，故 60s。
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          # ── 取证之手（2026-10-10）：web_fetch 的域名拦截是工具层 DNS 检查，不挡 shell
          #    出网（curl+UA 直取 200 实证）。bash 由 base 的 bash-sandbox executor 驱动，
          #    preset 只声明工具行（自包含原则：bundle 工具到不了会话——R1 教训）。
          #    CEO 挂它还有一层：单操作者模式分身继承 Lead 组合 ⇒ Lead 有手 = 分身有手。
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
          # ── 真实浏览器（第一手核证位，2026-10-10 全员化）：JS 重页面 / 反爬站 / 公众号文章
          #    的兜底通道；playwright-mcp 零模型 key，Chromium 与本仓 .pnpm store 同源。
          #    ⚠ browserUse 是需要 isolate realm 的服务 ⇒ 两行包组（shape 照 vp-sales 首挂）。
          - id: browser-use
            name: cordis:group
            group: true
            isolate:
              browserUse: true
            config:
              - id: browser-use-def
                name: '@deepseek-ai/dsh-browser-use'
              - id: browser-use-playwright
                name: '@deepseek-ai/dsh-experimental-browser-use-playwright-mcp'
                config:
                  mode: launch
                  headless: true

          # ④ 汇报线（通道 A，R3）：每个直接汇报对象一个**命名委托工具**——CEO 的模型看到的就是
          #    `vp_eng` / `vp_sales` 两个工具（per-instance persona 是 dsh-tool-subagent 的教义：
          #    "another persona … requires another distinctly named tool"）。
          #
          #    ⚠ **为什么是 one-shot 而不是 continuable（R3 实证，别再改回去）**：CEO 会话从**第一个
          #    请求起**就是 team-scoped——`tool-agent-team` 把 `send_message` / `list_agents` /
          #    `interrupt_agent` 三个名字**按成员作用域 shadow 掉了全局版**，而 Lead（CEO）自己也是
          #    team member（`snapshots/replay/r2-motion/sessions/lead.jsonl` 的第一帧 request/header 即是团队版；
          #    R3 `checks/smoke/delegation-smoke.mjs` 在全新会话复现）。更硬的一层：团队版 `send_message` 的
          #    参数是 `target`（"Team member **name**, or lead"），按名册名字寻址；而全局版是 `agent_id`
          #    （"any exact live Agent may target its **direct continuable child**"）。subagent child 不在
          #    名册上 ⇒ **continuable child 在 CEO 会话里无法被续驶**（既不能发消息也不能中断/列出）。
          #    所以这里用 `backgroundMode: one-shot` + `enableRunInBackground: false`：前台拿结果，
          #    "快捷出稿"语义；**连续对话/续驶归 team（spawn_teammate）**，那才是它的机制。
          #    并行快捷派活的 seam 已随 0.2.0 harvest 到位（subagent_fork 可续分叉——批1；workflow 编排——批4）；
          #    连续对话/续驶仍归 team（spawn_teammate），那是它的机制。
          #    出处：docs/delegation.md；探针 checks/smoke/delegation-smoke.mjs（默认档 = 这条边界的回归守卫）。
          #
          #    ⚠ 能力边界（诚实记账，别写进 persona 骗模型）：委托 child **继承 CEO 的组合**（design/roles-isolation
          #    §2/§4），所以它拿到的是 **CEO 的 skills**（chairing-staff-meeting），不是 vp-eng/vp-sales
          #    preset 里的角色 skills。因此 persona 必须**自带方法论**（写清产出形态与判据），不能指路到
          #    "先加载 tech-feasibility-review skill"——那个 skill 不在它的 catalog 里。
          #    "child 拿到角色完整 skills/工具面"是 M2 自定义 provider 才有的能力（design/roles-isolation §3）。
          #
          #    maxDepth: 1 ⇒ 委托 child 不能再委托 vp_eng/vp_sales（禁止 VP→VP 平级派活），也不能经通用
          #    `subagent` 再生 worker——通用行未设 maxDepth，rc.2 默认 = 1（vendor subagent/src/index.ts；
          #    0.1.7 时代「默认 3」已过期）。要嵌套需在行上显式写 maxDepth。
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
              # 0.2.0 harvest 批1：subagent_fork 可续跑的自身分叉（行形状照抄 standard）——
              # 并行快捷派活的上游 seam 到位（搁置池复活判据之一）；编排面（workflow）批4 再接。
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
              # 0.2.0 harvest 批4：workflow 编排（JS 脚本 fan-out 子代理，行形状照抄 standard）。
              # 编排位归 CEO（组织语义：同题多路并行调研 / 多稿同时出稿再聚合）；
              # 分工与续驶语义仍归 team / 命名委托两条路——workflow 是一次性的编排面。
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
              - id: tool-vp-eng
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: vp_eng
                  backgroundMode: one-shot
                  enableRunInBackground: false
                  maxDepth: 1
                  persona: |-
                    你是这家公司（梦之队）的 VP of Engineering——研发职能的化身。你的视角只有三件事：可行性、成本、技术风险。
                    你对 PRD 与技术方案有 veto 权：技术不可行、成本失控、风险不可接受，直接说不并给一句话理由。
                    产出形态：评审意见与技术评估——结论先行、一页纸为限，写完落 deliverables/<slug>/drafts/vp-eng.md。
                    需要深挖时用 subagent 生 workers 并行调研：给清晰 brief，汇总后署你自己的判断。
                    目录里若见 team 工具（spawn_teammate / team_task_* / wait_agent）——对一次性委托调不通（机制限制，上游已登记），别碰；并行调研只用 subagent。
                    你不替别的职能下结论——"有没有人买"问销售，"接不接得住"问运营，"钱撑不撑得住"问财务。
                    开工动作：先读 kb/vp-eng/CHARTER.md 与 kb/vp-eng/journal/ 最近 3 篇；收工向 journal 追加纪要。
              - id: tool-vp-sales
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: vp_sales
                  backgroundMode: one-shot
                  enableRunInBackground: false
                  maxDepth: 1
                  persona: |-
                    你是这家公司（梦之队）的 VP of Sales——销售职能的化身。梦之队 是高科技公司，三类业务：软件开发 / 服务 / 系统集成。你的视角只有三件事：客户、市场、定价。
                    你对"没人买"有 veto 权：需求不成立、商机不成熟、定价撑不住交付成本——直接说不，给一句话理由。
                    产出形态：市场判断与定价建议——结论先行、一页纸为限，写完落 deliverables/<slug>/drafts/vp-sales.md；引用 kb/vp-sales/CHARTER.md 的客户与竞品事实，禁止虚构客户。
                    需要深挖时用 subagent 生 workers 并行调研：给清晰 brief，汇总后署你自己的判断。
                    目录里若见 team 工具（spawn_teammate / team_task_* / wait_agent）——对一次性委托调不通（机制限制，上游已登记），别碰；并行调研只用 subagent。
                    你不替别的职能下结论——"做不做得出"问研发，"接不接得住"问运营。
                    开工动作：先读 kb/vp-sales/CHARTER.md 与 kb/vp-sales/journal/ 最近 3 篇；收工向 journal 追加纪要。

          # ⑤ 公司手册：把共享盘根的公司级 AGENTS.md 注入本会话（D7 的"公司手册 → project root"载体）
          # projectRootMarkers: [] ⇒ 不向上认 .git，projectRoot = 会话 cwd（= company-workspace/）；
          #   否则会认到开发仓库根，把**本仓的开发 AGENTS.md**（vendor 铁律等）灌进角色会话。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 32768  # 字节栅栏：verify handbook-budget 核对手册+1024B ≤ 此值（静默截断负例 = 2026-10-02 消化对账轮）
              projectRootMarkers: []
