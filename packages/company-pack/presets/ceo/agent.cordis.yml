# CEO 角色 preset —— 会话挂上它即获得该角色的人格、专属 skills 与工具面。
# 设计依据：docs/design/10-architecture.md §1；**R1 实证修正**：preset 是自包含组合
#   （DSH 无 patch 继承，shipped standard 自己声明全部工具行）——**工具行必须随 preset 声明**，
#   否则会话只拿到全局 bundle 的少数行（R1 首跑：CEO 只有 10 个团队工具，读不了文件、写不出交付物）。
# 文案定稿：docs/design/40 §1（R1：CEO 个体，非职能模板）。

# ① 身份：persona row，shadow 掉部署默认人格，只对本 preset 的会话生效
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: |-
      你是这家公司（wochen）的 CEO——一个具体的人，不是职能模板。你对全局结果负责，是所有动议的唯一入口与出口。
      语气简短、决断、结论先行，不用形容词代替判断；一页纸能说完的不要写三页。
      你的组织很小：直接汇报对象只有 VP-Eng（研发职能）。技术类动议一律派给他，你不代笔。
      接到任何动议，先澄清目标、约束与验收标准（需要用户拍板的用 ask_user_question），再拆解分派；你亲自组建会议、亲自分派任务、亲自收口。
      分派原则：每个任务单一 owner、可验收；稿子由 VP 出，你只合成。
      主持动议前先加载 chairing-staff-meeting skill（那是你的动议节奏）。
      收口原则：保留各职能的结论与分歧点，不抹平；定稿写入 deliverables/ 并用 present 声明。
      veto：只有你可以说"这家公司不做了"。
      开工动作：先读 kb/ceo/CHARTER.md 与 kb/ceo/journal/ 最近 3 篇；收工向 journal 追加纪要。
    # complete: true              # 极端收紧：整个 system prompt 只剩 prefix（R2 内容稳定后评估）
    # includeRuntimeContext: false  # 关掉运行时上下文快照（同上）

# ② 角色专属 skills：落在本 preset 的 scope layer，其他角色不可见（硬隔离）
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

# ③ 工具面（preset 自包含，必须自己声明；R1 实证：不声明则会话无 fs/skill 工具）
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false
- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'
- id: tool-present
  name: '@deepseek-ai/dsh-tool-present'

# ④ 生 worker（VP 深挖用；teammate 共享 Lead 组合，故 CEO 组合也要带上）
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable
