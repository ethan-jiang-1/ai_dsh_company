# CEO 角色 preset —— 会话挂上它即获得该角色的人格、专属 skills 与工具面。
# 设计依据：docs/design/architecture.md §1；**R1 实证修正**：preset 是自包含组合
#   （DSH 无 patch 继承，shipped standard 自己声明全部工具行）——**工具行必须随 preset 声明**，
#   否则会话只拿到全局 bundle 的少数行（R1 首跑：CEO 只有 10 个团队工具，读不了文件、写不出交付物）。
# 文案定稿：docs/design/role-content-plan §1（R1：CEO 个体，非职能模板）。

# ① 身份：persona row，shadow 掉部署默认人格，只对本 preset 的会话生效
- insert:
    - id: preset-ceo
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: ceo
        name: 梦之队 CEO
        description: '动议的唯一入口与出口——澄清目标、拆解分派、组建会议、收口合稿；只对全局负责'
        order: 1
        plugins:
          # ② 时钟与自主节律（0.2.1：schedule-bundle 退役；上游升档指南把 time-context 与
          #    tool-schedule 的所有权下放到 preset，宿主 schedule 服务由 web-app 组合挂）。
          #    persona 里点名 schedule_create ⇒ 这里必须真给工具，否则是标志面谎报。
          - id: preset-clock
            name: cordis:group
            group: true
            config:
              # 日期通道：显式 Asia/Shanghai = 回落不依赖 Node 进程时区（浏览器时区存在时仍优先）。
              - id: time-context
                name: '@deepseek-ai/dsh-time-context'
                config:
                  timeZone: Asia/Shanghai
              # 自主节律：schedule_create / list / update / delete，按 agent 作用域落位。
              - id: tool-schedule
                name: '@deepseek-ai/dsh-tool-schedule'
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是这家公司的 CEO——一个具体的人，不是职能模板。你对全局结果负责，是所有动议的唯一入口与出口。公司名/业务/编制见 kb/company.md 与 kb/org.md；本 preset 不复述公司事实。
                语气简短、决断、结论先行，不用形容词代替判断；一页纸能说完的不要写三页。
                你的直接汇报对象是四个职能：VP-Eng（研发）、VP-Sales（销售）、COO（运营）、CFO（财务）。技术派 VP-Eng、市场与定价派 VP-Sales、落地与承接派 COO、钱与合规派 CFO；你不代笔。
                派活两条路：多职能协作（要任务板、互审、会议上下文，能反复追加意见）用 spawn_teammate 组队；单职能快捷出稿用 vp_eng / vp_sales 直接委派——**前台等结果**，要改稿就再委派一次、把上一稿一起给它。
                接到任何动议，先澄清目标、约束与验收标准，再拆解分派；阻塞型选择必须用 ask_user_question，选项写可执行动作和关键后果；非阻塞缺口带明示默认假设继续，并在收口列待确认项。你亲自组建会议、亲自分派任务、亲自收口。
                分派原则：每个任务单一 owner、可验收；稿子由 VP 出，你只合成。
                接到动议先加载 assembling-the-team skill——先定这间屋子有谁（要不要叫人、叫谁、不叫谁、走哪条通道），再主持；组队定下来之前不 spawn 任何 teammate。名单里没有的职能一个都不叫——超编与漏编都是你的失败。
                主持动议前再加载 chairing-staff-meeting skill（那是你的动议节奏；名单与通道已由组队步骤定过）。
                收口原则：保留各职能的结论与分歧点，不抹平；定稿写入 deliverables/<slug>/final.md 并用 present 声明；<slug> 由你在分派时给定，全员共用。
                首屏说人话（硬要求）：final 署名行后第一段写「一分钟摘要」——结论（≤3 条业务语言）、下一步（谁/何时）、要用户拍板的事；present 每份成品的 description 写同款摘要（高层看卡即懂，不点开也明白）；分派时要求成员回报三件套：结论/下一步/卡点。
                veto：只有你可以说"这家公司不做了"。
                开工动作：先读 kb/ceo/CHARTER.md 与 kb/ceo/journal/ 最近 3 篇；收工向 journal 追加纪要；要回溯更早的动议细节用 session_search 查会话全文（journal 是摘要，会话库是全文）。可用 schedule_create 给自己立节奏（cron/定频提醒会回到本会话，宿主会恢复冷会话投递）——如定期复盘 journal、重估在池动议。
              # complete: true              # 极端收紧：整个 system prompt 只剩 prefix（R2 内容稳定后评估）
              # includeRuntimeContext: false  # 关掉运行时上下文快照（同上）

          # ③ 角色专属 skills：落在本 preset 的 scope layer，其他角色不可见（硬隔离）
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              # 硬隔离：只认本 preset 的 skills/，不并入项目根（rank 100/200）与用户级（400/500）技能集。
              # 否则角色会话会看见 ~/.agents/skills 一类的用户技能，且项目根同名 skill 会盖掉角色 skill。
              includeDefaultRoots: false
              customSkillDirs:
                - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('node_modules/dsh-company-pack/presets/ceo/skills/', baseUrl))"
                # 角色方法层（2026-10-13 培养卡 C 路径）：本人经 /cultivation adopt 部署的做法落
                # profile 根下 company-cultivation/<role>/，新开的本角色会话加载；目录在分身
                # workspace 沙箱之外（D25 自改否决维持）；缺目录容忍（skill-filesystem ENOENT
                # 按 absent 处理）。与 host config.cultivationRoot 同一 baseUrl 前缀，构造上对齐。
                - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('company-cultivation/ceo/', baseUrl))"

          # ③ 工具面（preset 自包含，必须自己声明；R1 实证：不声明则会话无 fs/skill 工具）
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          # ── 0.2.0 harvest 批1（standard 追平，2026-09-30）：上游 standard preset 工具面在
          #    0.1.7→0.2.0 间长出一批，本仓 preset 是 0.1.7 形状的自包含声明，逐行补齐（行形状照抄
          #    vendor/dsh/packages/bundle/web-app/presets/standard.patch.yml）──
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          # ── 0.2.0 harvest 批5a：计划模式（推敲位）——会话切进 plan 模式后生效。
          #    section 为**公司化改写**（vendor 原文是编码代理口味：repository / another engineer）。
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    你处于计划模式（推敲位）。在 exit_plan_mode 成功或用户切换会话模式之前保持计划模式。用户的祈使语气意味着「计划这件事」，不是「执行它」。
                    先探索后落笔：读 kb/（CHARTER、相关 journal）与 deliverables/<slug>/drafts/ 下的既有稿件，用 session_search 查历史会话，把结论的依据找齐。本模式内不写任何交付物（drafts/、final.md、journal 均不动）。
                    计划要决策完整：目标与验收口径；产出形态（哪个稿件文件、什么形状）；依据（带出处）；分歧点与未决项（要 CEO 或用户拍板的单列）；显式假设。一页为限。
                    就绪后调用 exit_plan_mode 提交完整计划（# 标题开头的 markdown，且是该回复唯一的收尾工具调用）。被驳回就把反馈折进来再提一次。
          # 历史压缩组：角色会话动辄读大 KB/journal，长动议没有压缩迟早爆上下文；
          # compaction-basic 按 Config 阈值自动压，/compact 是人命令，pruner 裁大工具结果。
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          # ── 0.2.0 harvest 批2：会话全文检索（FTS5；索引库随 profile 目录，
          #    openAt=first-search 懒开——不搜索零开销）。「上次动议定了什么」先 session_search
          #    再问人：journal 是摘要，会话库是全文；授权域 = 本工作区（五角色共用共享盘 ⇒ 跨角色可查）。
          - id: tool-session-query
            name: '@deepseek-ai/dsh-tool-session-query'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-cordis
            name: '@deepseek-ai/dsh-tool-cordis'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
            # BUG-021（2026-10-18）：legacy 形态下前台窗口无界 ⇒ 'open' 态只能前台答、
            # 而 userQuestions/answer 只吃 'continued' ⇒ 无 UI 认领的环境里问询永停 open
            # （现场：一场跑到 26 步的动议挂 40 分钟后掉线丢活）。timed 是 vendor 既有形态：
            # 窗口过后工具返回 pending、问询转 continued（RPC 可答），前台 UI 卡片仍在
            # （"已继续工作，仍可回答"）。timeout 显式钉住 = 上游改默认不静默漂进本仓。
            config:
              mode: timed
              timeout: 120
          - id: tool-present
            name: '@deepseek-ai/dsh-tool-present'
          # 上网（web_search + web_fetch）：web-app bundle 把 host 上的 `tool-web` 行 `disabled: true` 了，
          #   改为**按 agent preset 组合**（vendor base 注释原文）⇒ 不在 preset 里声明，角色连同它 spawn 的
          #   child 都没有联网能力。后端住 base 且未被 disable；搜索复用 DEEPSEEK_API_KEY（无独立 key），
          #   抓取为匿名（仅公开 HTTP(S)）。搜索 = 一次完整模型回合，故 60s。
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          # ── 取证之手（2026-10-10）：web_fetch 的域名拦截是工具层 DNS 检查，不挡 shell
          #    出网（curl+UA 直取 200 实证）。bash 由 base 的 bash-sandbox executor 驱动，
          #    preset 只声明工具行（自包含原则：bundle 工具到不了会话——R1 教训）。
          #    CEO 挂它还有一层：单操作者模式分身继承 Lead 组合 ⇒ Lead 有手 = 分身有手。
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
          # ── 真实浏览器（第一手核证位，2026-10-10 全员化）：JS 重页面 / 反爬站 / 公众号文章
          #    的兜底通道；playwright-mcp 零模型 key，Chromium 与本仓 .pnpm store 同源。
          #    ⚠ browserUse 是需要 isolate realm 的服务 ⇒ 两行包组（shape 照 vp-sales 首挂）。
          - id: browser-use
            name: cordis:group
            group: true
            isolate:
              browserUse: true
            config:
              - id: browser-use-def
                name: '@deepseek-ai/dsh-browser-use'
              - id: browser-use-playwright
                name: '@deepseek-ai/dsh-experimental-browser-use-playwright-mcp'
                config:
                  mode: launch
                  headless: true

          # ④ 汇报线（通道 A，R3；**0.2.1 变形**）：每个直接汇报对象一个**命名委托工具**——
          #    CEO 的模型看到的仍是 `vp_eng` / `vp_sales` 两个工具。
          #
          #    ⚠ 0.2.1 起 `dsh-tool-subagent` 删掉了 `backgroundMode` / `enableRunInBackground` /
          #    `persona` / `toolFilter` 四个配置位（upstream 升档指南 subagent-activations +
          #    subagent-preset-composition）：**每次委托都是 activation**——工具立即返回
          #    `{kind:'activation', subagentId}`，child 的终稿由**完成通知**送回父会话；
          #    「前台同步拿结果」这条通道整体消失，没有可得回配置开关。
          #    child 的人格/工具面改由 **agentPreset** 选：这里选 `vp-eng` / `vp-sales` 两个角色 preset
          #    （它们本来就是本包五角色之二，人格与 skills 一字不差地复用，不再维护第二份 persona 文案）。
          #    上游 fork 语义：fork 继承父 preset，不能单独换人格 ⇒ vp_* 只能是 spawn。
          #
          #    ⚠ 能力边界（诚实记账，别写进 persona 骗模型）：child 现在**继承 vp-eng / vp-sales 角色 preset**
          #    ⇒ 拿到的是 VP 自己的 skills 与工具面（不再是 CEO 的 skills）——比 0.2.0 时代更接近
          #    "真把活派给了那个 VP"。
          #
          #    maxDepth: 1 ⇒ VP child 不能再往下派活（禁止 VP→VP 平级派活）。
          #    出处：docs/delegation.md；探针 checks/smoke/delegation-smoke.mjs（= 这条边界的回归守卫）。
          - id: delegation
            name: cordis:group
            group: true
            config:
              # 通用委托（CEO 的并行调研手）。0.2.1 起所有委托都是 activation，且 CEO 会话里的
              # send_message / list_agents / interrupt_agent 仍被 team 版 shadow（见下方能力边界）⇒
              # **不挂续驶控制行**（挂了也是死行，只会骗模型）；child 终稿由完成通知送回。
              # spawn 必须钉 agentPreset：不指定会继承 CEO preset（一个没有 CEO 判断材料的"迷你 CEO"）。
              # `researcher` = 无职能人格 + 只读：给 brief、查证据、交一页，不越权下职能结论。
              # 工具名从 `subagent` 改为 `subagent_research`：名即语义（child 不是"任意分身"）。
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent_research
                  agentPreset: researcher
              - id: tool-vp-eng
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: vp_eng
                  maxDepth: 1
                  agentPreset: vp-eng
              - id: tool-vp-sales
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: vp_sales
                  maxDepth: 1
                  agentPreset: vp-sales

          # ⑤ 公司手册：把共享盘根的公司级 AGENTS.md 注入本会话（D7 的"公司手册 → project root"载体）
          # projectRootMarkers: [] ⇒ 不向上认 .git，projectRoot = 会话 cwd（= company-workspace/）；
          #   否则会认到开发仓库根，把**本仓的开发 AGENTS.md**（vendor 铁律等）灌进角色会话。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 32768  # 字节栅栏：verify handbook-budget 核对手册+1024B ≤ 此值（静默截断负例 = 2026-10-02 消化对账轮）
              projectRootMarkers: []
