# company-pack 的 bundle 层：plugin add 时并入的默认行（host 共享面；角色差异在 presets/）。
# 语法教义（R1 实证，源自 shipped dsh-headless 的 cordis.patch.yml）：
#   `- id: X` 只能替换 base/bundle 已有行；**新增行必须 `- insert:` 子列表**。
#   ⚠ roster 行用**替换**语法：web-app bundle 已 insert `agent-preset-registry`（default: standard），
#   我们的替换行把 default 改成 ceo；在无此行的组合（纯 headless）会 not found 警告丢弃
#   ——那种场景用 run/company.overlay.yml 的 insert 补。
# 依赖纪律（R5a 起）：runtime 依赖声明为 peerDependencies（不精确钉死；pre-stable API），
# 已认证 tag 台账在 checks/gates/lib/compat-tags.json（不随包分发）—— 合同见 docs/release.md。

# ── 产品 UI 收口（2026-11-02：去掉 Trajectory 页签与 New Terminal 入口）──
# 两行都是 web-app 出厂 UI 行；整行 disabled 是唯一不碰 vendor 的窄口径。
# 不用 developerTools 开关：它连带代码差异/交互预览与 built-in ptc/minimal，且是每用户设置。
# 用户决定与验收 = _backlog/_archive/settled_issues/2026-11-02-remove-trajectory-terminal-ui.md；
# 落地 Note = notes/implemented/2026-11-02-remove-trajectory-terminal-ui.md。
- id: ui-trajectory
  name: '@deepseek-ai/dsh-client-ui-trajectory'
  disabled: true
- id: ui-sidebar-terminal
  name: '@deepseek-ai/dsh-client-ui-sidebar-terminal'
  disabled: true

# ── preset roster（替换 web-app 出厂行：default 改 ceo）──
# 0.1.7 起预设声明模型变了：registry 一行（本处，按 id 替换 web-app 的 insert）+ **每个预设一行**
#   `@deepseek-ai/dsh-agent-preset`（预设的子插件行内联进 `config.plugins`）。五行分别住
#   `presets/<role>/agent.cordis.yml`，经 package.json 的 `dsh.bundle.patch` **数组**并入。
#   （旧模型 = `@deepseek-ai/dsh-agent-presets` 一行 + roots 目录扫描，该包在 0.1.7 已拆。）
- id: agent-preset-registry
  name: '@deepseek-ai/dsh-agent-preset-registry'
  config:
    default: ceo

# ── 会话全文检索（0.7.0）：insert + isolate 的独立 provider 组（官方 `session-search` 同款）──
# 为什么**不再**替换 base 的 `session-query-sqlite`：改值替换会在应用内安装（Plugins 页 /
#   `plugin_manager`）的 live recomposition 里重载被 `session-controller` 依赖的服务行；
#   rc.2 与 rc.5 实测都触发 `session-controller … file-upload: Agent resolver is already registered`，
#   `installBundle` 报 `application: failed`（CLI 安装 + 重启是绿的，但那不是默认路径）。
#   只新增行、不触碰既有行，两条安装路径都绿——官方 @deepseek-ai/dsh-experimental-session-search
#   就是这个形状（`isolate: { sessionQuery: true }` + 组内 provider + 组内工具）。
# 代价（显式，别当没发生）：隔离组只服务组内消费者，所以 DSH 侧栏的 `session/search` 保持出厂行为
#   （base 行仍是 `openAt: never`，有会话时搜索会报禁用），durable 索引只给五个角色的 `session_search` 工具用；
#   索引仍按 profile 落 `<DSH_HOME>/cache/company/`，仍单进程 owner、不跨 profile 共享。
# 工具行必须在组内：组外消费者看的是 root 的 host provider（未打开）。
- insert:
    - id: company-session-search
      name: cordis:group
      group: true
      isolate:
        sessionQuery: true
      config:
        - id: company-session-query-sqlite
          name: '@deepseek-ai/dsh-session-query-sqlite'
          config:
            path: !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('../../cache/company/session-search-' + process.getBuiltinModule('node:path').basename(process.getBuiltinModule('node:url').fileURLToPath(baseUrl)) + '.db', baseUrl))"
            openAt: first-search
        - id: company-tool-session-query
          name: '@deepseek-ai/dsh-tool-session-query'

- insert:
    # ── 日期通道 + 自主节律（0.2.0 harvest 批3；**0.2.1 改址**）──
    # 0.2.1 起实验性 schedule bundle 退役：宿主级 `schedule` 服务由
    # web-app 组合直接挂，`ui-schedule` 任务页随 web-app 一起出，而 `time-context` 与
    # `tool-schedule` 变成 **preset 行所有权**（上游升档指南 schedule-bundle-retired）。
    # ⇒ 本包不再在这里替换/插入任何 schedule 行：五个角色 preset 各自声明一个 `preset-clock`
    # 组（time-context 钉 Asia/Shanghai + tool-schedule），理由与「行必须随 preset 声明」同源
    # （R1 实证：bundle 工具到不了会话）。此处保持空 = 组合层只说"我不再拥有它"。
    # ── 交付物声明工具（base 无此行）──
    - id: tool-present
      name: '@deepseek-ai/dsh-tool-present'
    # ── 团队协作（主通道 M4/D4；直插行——未装官方 bundle，无续驶控制冲突，architecture §3 冲突注①）──
    #    config 钉值镜像官方 agent-team-profile patch（vendor packages/experimental/agent-team-profile/
    #    cordis.patch.yml）：官方把 maxMembers 钉回 8（代码默认 16）。钉住 = ① 与官方组合对齐；
    #    ② 上游改默认值不再静默漂进本仓（2026-10-02 立显式决定——此前裸 insert 无意识吃代码默认）。
    #    maxMembers 8 顺带是编制守卫：kb/org.md 超编的 spawn 会在服务层被拦。
    - id: agent-team
      name: '@deepseek-ai/dsh-experimental-agent-team'
      config:
        maxMembers: 8
        maxTasks: 256
        maxMessageBytes: 65536
        disposalTimeoutMs: 5000
    - id: tool-agent-team
      name: '@deepseek-ai/dsh-experimental-tool-agent-team'
      config:
        freshProvider: spawn
        forkProvider: fork
    # ── 团队 Web 可视面（官方 web-profile 的同一条 insert）：Team 按钮 / 名册 /
    #    实时任务板 / 点进 VP 会话 / 交付物卡片——观察与调试任务起止的最简途径（R1 补）──
    - id: ui-agent-team
      name: '@deepseek-ai/dsh-experimental-client-ui-agent-team'
    # ── 本包自己的 client 面：host 半 = 签字工具 + 培养回路（提案工具/命令族/方法层写入），
    #    浏览器半 = 品牌、任务板、公司页签与培养视图。行的 name 就是本包名。──
    - id: company-client
      name: 'dsh-company-pack'
      config:
        # 培养方法层根（2026-10-28 M3：公司级）：!!js 锚 baseUrl = loader 树根（profile 目录）。
        # `<home>/profiles/<p>/../../company/methods/` = `<DSH_HOME>/company/methods/`；与各角色
        # preset 的第二 customSkillDirs（../../company/methods/<role>/）同一前缀，host 写入与
        # preset 加载构造上对齐；端到端实证 = probes/session-context/cultivation-method-layer-probe.mjs。
        # 旧 `<profile>/company-cultivation/` 只读留一版，host 启动一次性迁移（含冲突备份）。
        cultivationRoot: !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('../../company/methods/', baseUrl))"
        # worker 是执行手，不是公司角色：不注入角色/汇报线/编制手册。未来 worker profile 加进这里。
        handbookSkipPresets: ['worker']
