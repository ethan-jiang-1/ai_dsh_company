# company-pack 的 bundle 层：plugin add 时并入的默认行（host 共享面；角色差异在 presets/）。
# 语法教义（R1 实证，源自 shipped dsh-headless 的 cordis.patch.yml）：
#   `- id: X` 只能替换 base/bundle 已有行；**新增行必须 `- insert:` 子列表**。
#   ⚠ roster 行用**替换**语法：web-app bundle 已 insert `agent-preset-registry`（default: standard），
#   我们的替换行把 default 改成 ceo；在无此行的组合（纯 headless）会 not found 警告丢弃
#   ——那种场景用 dev/company.overlay.yml 的 insert 补。
# 依赖纪律（R5a 起）：runtime 依赖声明为 peerDependencies（不精确钉死；pre-stable API），
# 兼容矩阵在 package.json 的 dsh.compatibility.dshReleases —— 合同见 docs/release.md。

# ── preset roster（替换 web-app 出厂行：default 改 ceo）──
# 0.1.7 起预设声明模型变了：registry 一行（本处，按 id 替换 web-app 的 insert）+ **每个预设一行**
#   `@deepseek-ai/dsh-agent-preset`（预设的子插件行内联进 `config.plugins`）。五行分别住
#   `presets/<role>/agent.cordis.yml`，经 package.json 的 `dsh.bundle.patch` **数组**并入。
#   （旧模型 = `@deepseek-ai/dsh-agent-presets` 一行 + roots 目录扫描，该包在 0.1.7 已拆。）
- id: agent-preset-registry
  name: '@deepseek-ai/dsh-agent-preset-registry'
  config:
    default: ceo

# ── 会话全文检索（0.2.0 harvest 批2）：base 出厂挂着 seam 但 openAt: never + :memory:
#   （派生索引重启即丢）。替换行翻开懒开 + durable 路径（锚 profile 目录，baseUrl = profile dir，
#   customSkillDirs 同款 !!js 先例）；索引库独立于会话库（上游教义：别指 session-persistence db）。
- id: session-query-sqlite
  name: '@deepseek-ai/dsh-session-query-sqlite'
  config:
    path: !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('session-search.db', baseUrl))"
    openAt: first-search

- insert:
    # ── 日期通道 + 自主节律（0.2.0 harvest 批3）：行归 schedule-bundle 所有 ──
    # schedule-bundle 是 **profile 级手动安装**（`dsh plugin --profile <name> add
    # @deepseek-ai/dsh-experimental-schedule-bundle` / Web 插件页开关），带来 time-context /
    # schedule / ui-schedule 三行（schedule = 宿主级 cron 定时 + 到点恢复冷会话投递——搁置池
    # 「自主节律」的复活 seam；ui-schedule = 任务页 UI）。本包**不 insert、不依赖**它：
    # 「pack dependencies ⇒ reconcile 自动启用」实测证伪（reconcile 只认直接安装的 bundle 包，
    # harvest Note §输掉的方案）；自己 insert 三行则与手动开关撞重复 id 硬拒。
    # 这里只留**替换行钉 config**：timeZone 回落不依赖 Node 进程时区（显式 Asia/Shanghai；
    # 浏览器时区存在时仍优先——vendor 教义）。行不存在的组合（无 bundle 层）该行 not-found 丢弃。
    - id: time-context
      name: '@deepseek-ai/dsh-time-context'
      config:
        timeZone: Asia/Shanghai
    # ── 交付物声明工具（base 无此行）──
    - id: tool-present
      name: '@deepseek-ai/dsh-tool-present'
    # ── 团队协作（主通道 M4/D4；直插行——未装官方 bundle，无续驶控制冲突，architecture §3 冲突注①）──
    #    config 钉值镜像官方 agent-team-profile patch（vendor packages/experimental/agent-team-profile/
    #    cordis.patch.yml）：官方把 maxMembers 钉回 8（代码默认 16）。钉住 = ① 与官方组合对齐；
    #    ② 上游改默认值不再静默漂进本仓（2026-10-02 立显式决定——此前裸 insert 无意识吃代码默认）。
    #    maxMembers 8 顺带是编制守卫：kb/org.md 超编的 spawn 会在服务层被拦。
    - id: agent-team
      name: '@deepseek-ai/dsh-experimental-agent-team'
      config:
        maxMembers: 8
        maxTasks: 256
        maxPendingMessagesPerMember: 64
        maxMessageBytes: 65536
        disposalTimeoutMs: 5000
    - id: tool-agent-team
      name: '@deepseek-ai/dsh-experimental-tool-agent-team'
      config:
        freshProvider: spawn
        forkProvider: fork
    # ── 团队 Web 可视面（官方 web-profile 的同一条 insert）：Team 按钮 / 名册 /
    #    实时任务板 / 点进 VP 会话 / 交付物卡片——观察与调试任务起止的最简途径（R1 补）──
    - id: ui-agent-team
      name: '@deepseek-ai/dsh-experimental-client-ui-agent-team'
    # ── 本包自己的 client 面（皮肤第一笔）：host 半是空壳，浏览器半注册
    #    `sidebar.brand.name` 槽（侧栏品牌名）。行的 name 就是本包名。──
    - id: company-client
      name: 'dsh-company-pack'
