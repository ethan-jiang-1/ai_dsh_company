# fresh-clone：干净 checkout 上的**仓库级**验收（安装 + bundle:init + 结构门禁）。
# 为什么独立于 ci.yml：ci.yml 不建 dev run bundle 的 workspace；本 job 证明 fresh clone 能
# 装依赖、建 company-workspace、跑全部 verify 门禁。
# 范围（诚实声明）：install-verify job **不**构建 vendor 全量/native、不跑 pnpm test；
# 2026-11-11 起由 setup-macos job 在 macOS 上单独证明 `pnpm setup` 全量构建 + verify + test。
# Ubuntu 全量构建仍有已知缺口（vendor lock 双锁、全 host OOM、client aggregate 测试类型、musl-gcc），
# 记录见 notes/implemented/2026-10-25-repo-hygiene-contract.md「已知缺口」节；不在这里假绿。
# 手动 + 每周一 03:00 UTC；Ubuntu + macOS 双跑（跨环境合同 = docs/repo-hygiene.md）。
# install-channel：Ubuntu 上用**真实 npm 发布版 DSH** 验六角色（channel-matrix-smoke；不是 vendor 通道）。
# 2026-11-11：global 版本钉回台账内 rc.5；export-dist 前补 vendor 类型面（干净 checkout 没有 lib/types）。
name: fresh-clone
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'
permissions:
  contents: read
concurrency:
  group: fresh-clone-${{ github.ref }}
  cancel-in-progress: true
jobs:
  install-verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: corepack enable pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm bundle:init
      - run: pnpm verify

  # 2026-11-11：把「clean clone 一条命令到可跑」变成 CI 证据。只跑 macOS 全量构建；
  # Linux 仍受 musl-gcc/vendor 双 lock 限制（见上），不在这里假绿。
  setup-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: corepack enable pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm bundle:init
      - run: pnpm run setup
      - run: node tools/setup.mjs --check
      - run: pnpm verify
      - run: pnpm test
      # 2026-11-13（研究 B 件）：环外资产的每周新鲜度回路。真入口证据不在 push 时必跑链里，
      # 最多陈旧 7 天；成员 = tools/lib/asset-lanes.mjs（skip 清单每次都打印，资产不许静默消失）。
      # 首几周若因干净环境差异红，按实际结果修环境或把对应资产标 ciSafe:false + 理由，不删资产。
      - run: node checks/smoke/all-keyless.mjs --ci
        timeout-minutes: 25
      - run: node checks/audit/coverage-ratchet.mjs
        timeout-minutes: 10

  install-channel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: corepack enable pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node tools/setup.mjs --types
      # 固定已实测的 npm 发布版；pack 的 install 锚必须走全局包，而不是 repo vendor。
      - run: npm install -g @deepseek-ai/dsh@0.2.1-rc.5
      - run: node tools/export-dist.mjs
      - run: node checks/smoke/channel-matrix-smoke.mjs --channel global --browser auto
