# CI 穷举与增量质量档（enforcement 通道第二档，2026-09-27 立；2026-11-28 补齐类型/lint/测试与真挂载）：
# - verify-and-typecheck（Ubuntu，每次 push/PR）：全量结构门禁 + 门禁自测 + vendor 类型构建 + pack 构建 + 全量 typecheck + lint + dup；
# - macos-test-and-mount（macOS）：跑全量 setup + keyless 回归（pnpm test），且当改动触及 packages/company-pack/**、checks/lanes/** 或工作流自身时，
#   安装 Chromium 并经 company --install-only 实跑 preset.entry.mjs + client-load.entry.mjs。
name: ci
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      run_mount: ${{ steps.surface.outputs.run_mount }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 2
      - id: surface
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            git fetch --no-tags --depth=1 origin "$BASE" || true
            CHANGED="$(git diff --name-only "$BASE" HEAD 2>/dev/null || echo 'packages/company-pack/')"
          else
            CHANGED="$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo 'packages/company-pack/')"
          fi
          if printf '%s\n' "$CHANGED" | grep -Eq '^(packages/company-pack/|checks/lanes/|\.github/workflows/)'; then
            echo "run_mount=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_mount=false" >> "$GITHUB_OUTPUT"
          fi
      - run: corepack enable pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # verify 的 YAML/MD 解析原语经 vendor/dsh/package.json 锚解析 js-yaml/mdast（setup.mjs install() 同款命令）。
      - run: pnpm -C vendor/dsh install --frozen-lockfile --ignore-scripts
      - run: pnpm verify
      - run: pnpm test:checks
      - run: node tools/dev/setup.mjs --types --skip-install
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - run: node ./node_modules/typescript/bin/tsc -b packages/company-pack
      - run: ./node_modules/.bin/tsdown --config packages/company-pack/tsdown.config.ts
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm dup

  macos-test-and-mount:
    needs: verify-and-typecheck
    runs-on: macos-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: corepack enable pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm bundle:init
      - run: pnpm run setup
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - run: pnpm test
      - name: Run live preset and client-load mount smoke
        if: needs.verify-and-typecheck.outputs.run_mount == 'true'
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/runtime/pw-browsers
        run: |
          ./node_modules/.pnpm/node_modules/.bin/playwright install chromium
          node tools/dev/build-client.mjs
          bash -c 'set -o pipefail && source run/env.sh && node tools/dev/company.mjs --install-only && node checks/lanes/preset.entry.mjs && node checks/lanes/client-load.entry.mjs'
