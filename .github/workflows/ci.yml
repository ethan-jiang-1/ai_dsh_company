# CI 穷举档（enforcement 通道第二档，2026-09-27 立）：干净环境跑全量结构门禁。
# 为什么：pre-push hook 防「忘了跑」，CI 防「本地环境差异」与「--no-verify 绕过」（DSH：CI owns exhaustive）。
# test lane 不在 CI（2026-09-28 首跑红实证定界，run 36373885805）：vitest 的 vendor 内部
# @deepseek-ai/* 解析走包入口（未构建 lib），干净环境必红；补齐 = 全量 vendor 构建链
# （DSH 自己的 test 脚本 = build && vitest），负担不成比例 ⇒ test 的 enforcement 挪进
# pre-push hook（本地 dev 树按 bootstrap 必然已构建，test 1.3s 便宜高置信）。触发条件
# （上游提供免构建 test 路径 / 第二贡献者进场值得付构建链）成立再回 CI。
# ⚠ verify 不是零依赖：scripts/lib/markdown-links.mjs 复用 vendor 工作区的解析器依赖
# （mdast-util-from-markdown 等，经 vendor/dsh/package.json 解析——首跑失败的根因即此），
# 所以走标准引导（dev-loop §7 第 3 步）：corepack + pnpm install --frozen-lockfile。
name: ci
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: corepack enable pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
